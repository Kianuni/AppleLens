name: Build & Release AppleLens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build universal DMG, PKG & ZIP installers
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.2.0"
          fi
          BUILD_NUMBER="${BUILD_NUMBER:-3}"
          chmod +x scripts/build_app.sh scripts/package_release.sh scripts/install.sh
          VERSION="${VERSION}" BUILD_NUMBER="${BUILD_NUMBER}" ./scripts/package_release.sh
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleLens-v${{ env.RELEASE_VERSION }}-macos-universal
          path: |
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-universal.dmg
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-installer.pkg
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-macos-universal.zip
            dist/SHA256SUMS.txt

      - name: Check existing GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_COUNT="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")"
          if ! [[ "${ASSET_COUNT}" =~ ^[0-9]+$ ]]; then
            ASSET_COUNT=0
          fi
          echo "Existing release asset count for ${GITHUB_REF_NAME}: ${ASSET_COUNT}"
          if [[ "${ASSET_COUNT}" -ge 4 ]]; then
            echo "SKIP_RELEASE_UPLOAD=true" >> "${GITHUB_ENV}"
          else
            echo "SKIP_RELEASE_UPLOAD=false" >> "${GITHUB_ENV}"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SKIP_RELEASE_UPLOAD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-universal.dmg
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-installer.pkg
            dist/AppleLens-v${{ env.RELEASE_VERSION }}-macos-universal.zip
            dist/SHA256SUMS.txt
